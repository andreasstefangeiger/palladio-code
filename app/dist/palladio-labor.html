<script type="module">
// Palladio-Code design engine (browser + node). Mirrors src/palladio_code/design.py;
// tests/test_app_engine.py checks both against the same cases.

const FORMS = {
  "1:1": 1, "4:3": 4 / 3, "sqrt2:1": Math.SQRT2, "3:2": 1.5, "5:3": 5 / 3, "2:1": 2,
};
const TOL = 0.01;

const snap = (v, step = 0.5) => Math.round(v / step) * step;
const relDev = (v, t) => Math.abs(v - t) / t;

const MEANS = {
  I23_first: (l, b) => (l + b) / 2,
  I23_second: (l, b) => Math.sqrt(l * b),
  I23_third: (l, b) => (2 * l * b) / (l + b),
};
const MEAN_RULE = { I23_first: "A-HT-VAULT-002", I23_second: "A-HT-VAULT-003", I23_third: "A-HT-VAULT-004" };

const DEFAULTS = {
  module: 16,
  wall: 1.5,
  sala_form: "5:3",
  rooms: [
    { size: "grande", form: "5:3", ceiling: "vault" },
    { size: "mediocre", form: "1:1", ceiling: "vault" },
    { size: "picciola", form: "4:3", ceiling: "vault" },
  ],
  upper_factor: 5 / 6,
  window_ratio: 1 / 4.5,
};

// nearest of the seven forms to a ratio, with its relative deviation
function nearestForm(ratio) {
  let best = null;
  for (const [name, v] of Object.entries(FORMS)) {
    const dev = relDev(ratio, v);
    if (!best || dev < best.dev) best = { name, value: v, dev };
  }
  return best;
}

function run(input = {}) {
  const p = { ...DEFAULTS, ...input, rooms: (input.rooms || DEFAULTS.rooms).map((r) => ({ ...r })) };
  const w = p.module, wall = p.wall;
  const decisions = [];
  const log = (step, topic, decision, rules, status = "follows", note = "") =>
    decisions.push({ step, topic, decision, rules, status, note });

  log(1, "module", `${w}`, ["B-SYS-MOD-001"], "follows");
  log(1, "wall", `${wall}`, [], "assumption");

  // step 4: wing rooms (grande extends the module, picciola shortens it)
  let y = wall;
  const rooms = p.rooms.map((r) => {
    const ratio = FORMS[r.form] ?? 1;
    let depth = r.depth ?? (ratio === 1 ? w : snap(r.size === "picciola" ? w / ratio : w * ratio));
    const room = { ...r, width: w, depth, y };
    room.length = Math.max(w, depth);
    room.breadth = Math.min(w, depth);
    room.ratio = room.length / room.breadth;
    const near = nearestForm(room.ratio);
    room.nearest = near.name;
    room.status = near.dev < 1e-9 ? "follows" : near.dev <= TOL ? "approx" : "deviation";
    y += depth + wall;
    log(4, "form", `${room.size}: ${room.length} x ${room.breadth}`, ["A-PROP-ROOM-001", "B2-CAP2-1"],
      room.status, room.status === "follows" ? "" : `${room.ratio.toFixed(4)} ~ ${near.name}`);
    return room;
  });
  const areas = rooms.map((r) => r.width * r.depth);
  const descending = areas.every((a, i) => i === 0 || areas[i - 1] >= a);
  log(4, "sequence", descending ? "grande-mediocre-picciola" : "not descending", ["B2-CAP2-1"],
    descending ? "follows" : "deviation");
  const wingDepth = y;

  // step 2: centre
  const salaDepth = wingDepth - 2 * wall;
  const salaWidth = p.sala_width ?? snap(salaDepth / (FORMS[p.sala_form] ?? 5 / 3));
  const sala = { width: salaWidth, depth: salaDepth, x: wall + w + wall, y: wall };
  sala.length = Math.max(salaWidth, salaDepth);
  sala.breadth = Math.min(salaWidth, salaDepth);
  sala.ratio = sala.length / sala.breadth;
  log(2, "centre", `${sala.length} x ${sala.breadth}`, ["A-ORG-CEN-001", "A-DIM-HALL-001"],
    sala.ratio <= 2 + 1e-9 ? "follows" : "deviation");

  // step 3: symmetry
  log(3, "symmetry", "mirror", ["A-ORG-SYM-001"], p.asymmetric ? "deviation" : "follows");

  // step 5: heights
  const square = rooms.find((r) => r.length === r.breadth && r.ceiling === "vault");
  const target = square ? (square.breadth * 4) / 3 : null;
  for (const r of rooms) {
    if (r.ceiling === "flat") {
      r.height = r.breadth; r.heightRule = "flat_h_eq_w"; r.rules = ["A-HT-ROOM-001"];
    } else if (r.length === r.breadth) {
      r.height = (r.breadth * 4) / 3; r.heightRule = "I23_square_4_3"; r.rules = ["A-HT-VAULT-001"];
    } else {
      r.means = Object.fromEntries(Object.entries(MEANS).map(([k, f]) => [k, f(r.length, r.breadth)]));
      let method = r.method;
      if (!method) {
        method = target === null ? "I23_first"
          : Object.keys(MEANS).reduce((a, b) => (relDev(r.means[a], target) <= relDev(r.means[b], target) ? a : b));
      }
      r.height = r.means[method]; r.heightRule = method; r.rules = [MEAN_RULE[method]];
    }
    log(5, "height", `${r.size}: ${r.height.toFixed(2)} (${r.heightRule})`, r.rules);
  }
  const rowHeights = rooms.filter((r) => r.ceiling === "vault" && r.size !== "picciola").map((r) => r.height);
  let spread = null;
  if (rowHeights.length > 1) {
    spread = (Math.max(...rowHeights) - Math.min(...rowHeights)) / Math.max(...rowHeights);
    log(5, "equal_heights", `${(spread * 100).toFixed(1)} %`, ["A-HT-VAULT-005", "B-SYS-VAULT-001"],
      spread <= TOL ? "follows" : "deviation");
  }

  // step 6: upper floor
  const mainH = rowHeights.length ? Math.max(...rowHeights) : w;
  const upper = mainH * p.upper_factor;
  log(6, "upper", upper.toFixed(2), ["A-HT-STORY-001"],
    Math.abs(p.upper_factor - 5 / 6) < 1e-9 ? "follows" : "deviation");

  // step 7: openings
  const winW = snap(w * p.window_ratio, 0.25);
  const winH = (winW * 13) / 6;
  const winOk = winW >= w / 5 - 1e-9 && winW <= w / 4 + 1e-9;
  log(7, "window", `${winW} x ${winH.toFixed(2)}`, ["A-DIM-WIN-001", "A-DIM-WIN-002"], winOk ? "follows" : "deviation");
  log(7, "window_upper", ((winH * 5) / 6).toFixed(2), ["A-DIM-WIN-003"]);
  log(7, "axes", "aligned", ["A-ORG-OPEN-001", "A-LOC-WIN-001"]);
  log(7, "door", "3 x 6.5", ["A-DIM-DOOR-001"]);

  return {
    params: p, rooms, sala, spread, target, mainHeight: mainH, upperHeight: upper,
    window: { width: winW, height: winH, upperHeight: (winH * 5) / 6 }, decisions,
    total: { width: wall + w + wall + salaWidth + wall + w + wall, depth: wingDepth },
  };
}

function nearestPalladio(design, readings) {
  const by = {};
  for (const r of readings) if (r.length && r.confidence !== "low") (by[r.building] ||= []).push([r.length, r.width]);
  let best = null;
  for (const [b, rooms] of Object.entries(by)) {
    let cost = 0;
    for (const r of design.rooms) cost += Math.min(...rooms.map(([l, w]) => Math.abs(r.length - l) + Math.abs(r.breadth - w)));
    if (!best || cost < best.cost) best = { building: b, cost, rooms };
  }
  return best;
}

en bis zur Balkenlage der Raumbreite.", "it": "Se in solaro; l'altezza dal pavimento alla travatura sarà quanto la loro larghezza.", "de": "Bei einer Balkendecke ist die Höhe vom Fußboden bis zur Balkenlage so groß wie die Raumbreite.", "where": "Buch 1, Kap. XXIII, S. 53", "confidence": null}, "A-HT-STORY-001": {"cls": "A", "text": "Die Räume des Obergeschosses sind um ein Sechstel niedriger als die darunterliegenden.", "it": "e le stanze di sopra saranno per la sesta parte meno alte di quelle di sotto.", "de": "Die oberen Räume sollen um ein Sechstel niedriger sein als die unteren.", "where": "Buch 1, Kap. XXIII, S. 53", "confidence": null}, "A-HT-VAULT-001": {"cls": "A", "text": "Bei einem quadratischen, gewölbten Raum beträgt die Höhe die Breite zuzüglich eines Drittels.", "it": "l'altezze de' volti nelle stanze quadre si faranno aggiunta la terza parte alla larghezza della stanza.", "de": "Die Gewölbehöhen quadratischer Räume werden aus der Raumbreite zuzüglich ihres Drittels gebildet.", "where": "Buch 1, Kap. XXIII, S. 53", "confidence": null}, "A-HT-VAULT-002": {"cls": "A", "text": "Für längliche Räume kann die Gewölbehöhe als arithmetisches Mittel aus Länge und Breite bestimmt werden: h=(L+B)/2.", "it": "si ritroverà ponendo la larghezza appresso la lunghezza, e dividendo il tutto in due parti uguali: percioche una di quelle metà sarà l'altezza del volto.", "de": "Man findet sie, indem man Breite und Länge zusammenstellt und die Summe in zwei gleiche Teile teilt; eine Hälfte ist die Gewölbehöhe.", "where": "Buch 1, Kap. XXIII, S. 53", "confidence": null}, "A-HT-VAULT-003": {"cls": "A", "text": "Alternativ kann die Gewölbehöhe als geometrisches Mittel aus Länge und Breite bestimmt werden: h=sqrt(L·B).", "it": "troveremo un numero c'habbia quella proportione alla larghezza, che la lunghezza haverà à lui: e lo ritroveremo moltiplicando il minore estremo co'l maggiore: perche la radice quadrata di quello che procederà da detta moltiplicatione sarà l'altezza che cerchiamo.", "de": "Wir suchen eine Zahl, die zur Breite im selben Verhältnis steht wie die Länge zu ihr; die Quadratwurzel aus dem Produkt der Extreme ist die gesuchte Höhe.", "where": "Buch 1, Kap. XXIII, S. 53", "confidence": null}, "A-HT-VAULT-004": {"cls": "A", "text": "Als dritte und niedrigste proportionale Gewölbehöhe kann das harmonische Mittel bestimmt werden: h=2LB/(L+B).", "it": "Si può ancho ritrovare un'altra altezza, che sarà minore: ma nondimeno proportionata alla stanza [...].", "de": "Man kann noch eine andere, niedrigere, aber dennoch zum Raum proportionierte Höhe finden [es folgt die geometrische und numerische Konstruktion].", "where": "Buch 1, Kap. XXIII, S. 54", "confidence": null}, "A-HT-VAULT-005": {"cls": "A", "text": "Unter den drei proportionalen Höhen darf so gewählt werden, dass verschieden große Räume gleich hohe Gewölbe und damit einen durchgehenden Oberboden erhalten.", "it": "ci serviremo di ciascuna di queste altezze, secondo che tornerà bene per far che più stanze di diverse grandezze habbiano i volti egualmente alti, e nondimeno detti volti siano proportionati à quelle: dal che ne risulterà e bellezza all'occhio, e commodità per il suolo, ò pavimento che andarà loro sopra: perche verrà ad esser tutto uguale.", "de": "Wir verwenden jede dieser Höhen so, wie es sich eignet, damit mehrere verschieden große Räume gleich hohe, dennoch jeweils proportionierte Gewölbe erhalten; daraus entstehen Schönheit und ein einheitlicher Boden darüber.", "where": "Buch 1, Kap. XXIII, S. 54", "confidence": null}, "A-DIM-DOOR-001": {"cls": "A", "text": "Zimmertüren sollen zwischen 2 und 3 Fuß breit und zwischen 5 und 6,5 Fuß hoch sein.", "it": "Le porte delle stanze non si faranno più larghe di tre piedi, & alte sei, e mezo; nè meno di due piedi in larghezza, e cinque in altezza.", "de": "Zimmertüren werden nicht breiter als drei Fuß und nicht höher als sechseinhalb, aber auch nicht schmaler als zwei und nicht niedriger als fünf Fuß ausgeführt.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-DIM-WIN-001": {"cls": "A", "text": "Die Fensterbreite soll zwischen einem Fünftel und einem Viertel der Raumbreite liegen.", "it": "non si faranno finestre più larghe della quarta parte della larghezza delle stanze: nè più strette della quinta.", "de": "Fenster sollen nicht breiter als ein Viertel und nicht schmaler als ein Fünftel der Raumbreite sein.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-DIM-WIN-002": {"cls": "A", "text": "Die Fensterhöhe beträgt zwei Fensterbreiten zuzüglich eines Sechstels der Fensterbreite, also 13/6 der Breite.", "it": "e si faranno alte due quadri, e di più la sesta parte della larghezza loro.", "de": "Sie werden zwei Breiten hoch ausgeführt, zuzüglich eines Sechstels ihrer Breite.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-DIM-WIN-003": {"cls": "A", "text": "Fenster jedes höheren Geschosses sind in der lichten Höhe jeweils um ein Sechstel gegenüber dem darunterliegenden Geschoss zu vermindern.", "it": "Le finestre di sopra, cioè quelle del secondo ordine deono essere la sesta parte minori della lunghezza della luce di quelle di sotto, e se altre finestre più di sopra si faranno similmente per la sesta parte si deono diminuire.", "de": "Die Fenster des zweiten Rangs sollen in ihrer lichten Höhe um ein Sechstel kleiner sein als die unteren; weitere Fenster darüber sind ebenso jeweils um ein Sechstel zu vermindern.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-ORG-OPEN-001": {"cls": "A", "text": "Fenster rechts und links müssen einander entsprechen; obere Fenster und Türen müssen jeweils lotrecht über den unteren liegen.", "it": "Debbono le finestre da man destra corrispondere à quelle da man sinistra: e quelle di sopra essere al diritto di quelle di sotto: e le porte similmente tutte essere al diritto una sopra l'altra: accioche sopra il vano sia il vano, e sopra il pieno sia il pieno: & ancho rincontrarsi acciò che stando in una parte della casa, si possa vedere fin dall'altra: il che apporta vaghezza, e fresco la Estate, & altri commodi.", "de": "Rechte und linke Fenster müssen korrespondieren; obere Fenster und Türen müssen über den unteren liegen, damit Öffnung über Öffnung und Voll über Voll steht und Durchsicht, Schönheit sowie sommerliche Frische entstehen.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-LOC-WIN-001": {"cls": "A", "text": "Fenster sind von den Gebäudeecken abzurücken.", "it": "Deono le finestre allontanarsi da gli angoli, ò cantoni della fabrica [...] percioche non deve essere aperta, & indebolita quella parte, la quale ha da tener diritto, & insieme tutto'l restante dell'Edificio.", "de": "Fenster müssen von den Ecken des Gebäudes entfernt bleiben, weil jener Teil, der den gesamten Bau zusammenhält, nicht geöffnet und geschwächt werden darf.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "A-DIM-JAMB-001": {"cls": "A", "text": "Tür- und Fenstergewände sollen zwischen einem Sechstel und einem Fünftel der lichten Öffnungsbreite stark sein.", "it": "Le Pilastrate, overo Erte delle porte, e delle finestre non vogliono essere nè meno grosse della sesta parte della larghezza della luce, nè più della quinta.", "de": "Die Gewände der Türen und Fenster sollen nicht dünner als ein Sechstel und nicht stärker als ein Fünftel der lichten Breite sein.", "where": "Buch 1, Kap. XXV, S. 55", "confidence": null}, "B-SYS-MOD-001": {"cls": "B", "text": "Im untersuchten Abschnitt fungiert die Raumbreite als primäre Bezugsgröße, aus der Grundrisslänge, Raumhöhe und Fensterbreite abgeleitet werden.", "it": "la lunghezza loro sarà [...] del quadrato della larghezza [...] l'altezza [...] sarà quanto la loro larghezza [...] finestre [...] della larghezza delle stanze", "de": "Die Länge, Höhe und Fensterbreite werden in mehreren Regeln auf die Raumbreite bezogen.", "where": "Buch 1, Kap. XXI-XXV, S. 52-55", "confidence": 0.92}, "B-SYS-GRID-001": {"cls": "B", "text": " const store = {
  get(k, d) { try { const v = localStorage.getItem("pc-lab-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pc-lab-" + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
let lang = store.get("lang", "de");
let step = store.get("step", 0);
let params = store.get("params", JSON.parse(JSON.stringify(DEFAULTS)));
let audio = null;
const t = () => T[lang];
const fmt = (v) => (Math.round(v * 100) / 100).toLocaleString(lang === "de" ? "de-DE" : "en-GB");
const ft = (v) => {
  const whole = Math.floor(v + 1e-9), frac = v - whole;
  const map = [[0, ""], [0.25, "¼"], [0.5, "½"], [0.75, "¾"]];
  const m = map.find(([f]) => Math.abs(frac - f) < 1e-6);
  return m ? `${whole || (m[1] ? "" : "0")}${m[1]}` : fmt(v);
};

function tone(ratio) {
  if (!audio) return;
  const now = audio.currentTime, base = 220;
  [[base, 0], [base * ratio, 0.45], [base, 0.95], [base * ratio, 0.95]].forEach(([f, at]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + at); g.gain.linearRampToValueAtTime(0.12, now + at + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + at + 1.3);
    o.connect(g).connect(audio.destination); o.start(now + at); o.stop(now + at + 1.4);
  });
}

function save() { store.set("params", params); store.set("step", step); store.set("lang", lang); }

function statusFor(d, stepIndex) {
  const ds = d.decisions.filter((x) => x.step === stepIndex + 1 && x.status !== "assumption");
  if (stepIndex === 7) return null;
  if (ds.some((x) => x.status === "deviation")) return "deviation";
  if (ds.some((x) => x.status === "approx")) return "approx";
  return ds.length ? "follows" : null;
}

function renderRail(d) {

}

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function renderPlan(d) {
  const svg = document.getElementById("plan");
  svg.innerHTML = "";
  const S = 9, pad = 24, wall = d.params.wall, w = d.params.module;
  const W = d.total.width * S, H = d.total.depth * S;
  svg.setAttribute("viewBox", `${-pad} ${-pad} ${W + 2 * pad} ${H + 2 * pad + 18}`);
  svg.append(el("rect", { x: 0, y: 0, width: W, height: H, fill: css("--wall") }));
  const rightX = wall + w + wall + d.sala.width + wall;
  const room = (x, y, rw, rd, fill, lines, faded) => {
    svg.append(el("rect", { x: x * S, y: y * S, width: rw * S, height: rd * S, fill, opacity: faded ? 0.55 : 1 }));
    lines.forEach((line, k) => svg.append(el("text", { x: (x + rw / 2) * S, y: (y + rd / 2) * S + (k - (lines.length - 1) / 2) * 19 + 5,
      "text-anchor": "middle", class: k ? "muted" : "" }, line)));
  };
  d.rooms.forEach((r, i) => {
    const lines = [`${ft(r.length)} × ${ft(r.breadth)}`, FORM_LABEL[r.nearest] + (r.status === "follows" ? "" : " ~"), `h ${fmt(r.height)}`];
    const fill = i === activeRoom && step === 3 ? css("--accent-soft") : css("--paper");
    room(wall, r.y, r.width, r.depth, fill, lines);
    room(rightX, r.y, r.width, r.depth, css("--paper"), lines, d.params.asymmetric);
    const hy = (r.y + r.depth) * S;
    const g = el("g", { class: "handle", "data-room": i, tabindex: 0, role: "slider",
      "aria-label": `${t().sizes[r.size] || r.size}: ${ft(r.depth)} ${t().feet}`, "aria-valuenow": r.depth });
    g.append(el("rect", { x: wall * S, y: hy - 9, width: r.width * S, height: 18, fill: "transparent" }));
    g.append(el("rect", { x: (wall + r.width / 2) * S - 18, y: hy - 3, width: 36, height: 6, rx: 3, fill: css("--accent") }));
    svg.append(g);
  });
  room(d.sala.x, d.sala.y, d.sala.width, d.sala.depth, css("--paper"),
    [t().sala, `${ft(d.sala.length)} × ${ft(d.sala.breadth)}`, `${t().ratio} ${fmt(d.sala.ratio)}`]);
  svg.append(el("text", { x: 0, y: H + 18, class: "muted" }, `${ft(d.total.width)} × ${ft(d.total.depth)} ${t().feet}`));
  bindHandles(svg, S);
}

let activeRoom = 0;
function bindHandles(svg, S) {
  svg.querySelectorAll(".handle").forEach((g) => {
    const i = Number(g.dataset.room);
    g.onpointerdown = (ev) => {
      ev.preventDefault(); g.setPointerCapture(ev.pointerId); activeRoom = i;
      const pt = svg.createSVGPoint();
      const startDepth = currentDesign.rooms[i].depth, startY = toSvg(ev).y;
      function toSvg(e) { pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
      g.onpointermove = (e) => {
        let depth = Math.max(6, Math.round((startDepth + (toSvg(e).y - startY) / S) * 2) / 2);
        const w = params.module, ratio = Math.max(w, depth) / Math.min(w, depth), near = nearestForm(ratio);
        if (near.dev <= 0.02) depth = depth >= w ? Math.round(w * near.value * 2) / 2 : Math.round((w / near.value) * 2) / 2;
        params.rooms[i].depth = depth; params.rooms[i].form = near.name;
        render(true);
      };
      g.onpointerup = () => {
        g.onpointermove = null; save();
        const r = currentDesign.rooms[i]; tone(r.ratio); if (step !== 3) { step = 3; save(); render(); }
      };
    };
    g.onkeydown = (e) => {
      const delta = e.key === "ArrowDown" ? 0.5 : e.key === "ArrowUp" ? -0.5 : 0;
      if (!delta) return;
      e.preventDefault();
      params.rooms[i].depth = Math.max(6, currentDesign.rooms[i].depth + delta);
      params.rooms[i].form = nearestForm(Math.max(params.module, params.rooms[i].depth) / Math.min(params.module, params.rooms[i].depth)).name;
      save(); render();
    };
  });
}

function renderElevation(d) {
  const svg = document.getElementById("elev");
  svg.innerHTML = "";
  const S = 7, w = d.params.module, wall = d.params.wall;
  const front = d.rooms[0], base = 5;
  const h1 = d.mainHeight, h2 = d.upperHeight;
  const W = d.total.width * S, H = (base + h1 + h2 + 3) * S, pad = 26;
  svg.setAttribute("viewBox", `${-pad - 30} ${-pad} ${W + 2 * pad + 30} ${H + 2 * pad}`);
  const y0 = H; // ground line
  svg.append(el("line", { x1: -20, y1: y0, x2: W + 20, y2: y0, stroke: css("--fg"), "stroke-width": 1 }));
  const top = y0 - (base + h1 + h2) * S;
  svg.append(el("rect", { x: 0, y: top, width: W, height: (base + h1 + h2) * S, fill: "none", stroke: css("--fg"), "stroke-width": 1.2 }));
  svg.append(el("line", { x1: 0, y1: y0 - base * S, x2: W, y2: y0 - base * S, stroke: css("--line") }));
  svg.append(el("line", { x1: 0, y1: y0 - (base + h1) * S, x2: W, y2: y0 - (base + h1) * S, stroke: css("--line") }));
  // dimension labels
  const dim = (y1, y2, label) => {
    svg.append(el("line", { x1: -14, y1, x2: -14, y2, stroke: css("--muted") }));
    svg.append(el("text", { x: -18, y: (y1 + y2) / 2 + 4, "text-anchor": "end", class: "muted" }, label));
  };
  dim(y0 - base * S, y0 - (base + h1) * S, fmt(h1));
  dim(y0 - (base + h1) * S, top, fmt(h2));
  // windows centred in the two front rooms and the hall (axes above one another)
  const ww = d.window.width, wh = d.window.height, wu = d.window.upperHeight;
  const axes = [wall + w / 2, d.sala.x + d.sala.width / 2, d.total.width - wall - w / 2];
  for (const ax of axes) {
    const x = (ax - ww / 2) * S;
    svg.append(el("rect", { x, y: y0 - (base + 2 + wh) * S, width: ww * S, height: wh * S, fill: css("--wall") }));
    svg.append(el("rect", { x, y: y0 - (base + h1 + 1.5 + wu) * S, width: ww * S, height: wu * S, fill: css("--wall") }));
  }
  // section through the row: vault heights of the wing rooms to scale
  d.rooms.forEach((r, i) => {
    const x = W + 14 + i * 12;
    svg.append(el("rect", { x, y: y0 - (base + r.height) * S, width: 8, height: r.height * S, fill: i === 2 ? css("--line") : css("--accent"), opacity: 0.8 }));
  });
  svg.append(el("text", { x: 0, y: y0 + 16, class: "muted" }, `${fmt(ww)} × ${fmt(wh)} · ${t().feet}`));
}

function ruleCard(id) {

function bindPanel() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach((b) => (b.onclick = () => fn(b)));
  const setModule = (v) => { params.module = Math.min(30, Math.max(10, v)); params.rooms.forEach((r) => delete r.depth); save(); render(); };
  on("#m-minus", () => setModule(params.module - 0.5));
  on("#m-plus", () => setModule(params.module + 0.5));
  on("[data-m]", (b) => setModule(Number(b.dataset.m)));
  on("[data-sala]", (b) => { params.sala_form = b.dataset.sala; save(); render(); });
  on("[data-form]", (b) => { const r = params.rooms[b.dataset.room]; r.form = b.dataset.form; delete r.depth; save(); render(); tone(FORMS[r.form]); });
  on("[data-tone]", (b) => tone(currentDesign.rooms[b.dataset.tone].ratio));
  on("[data-ceil]", (b) => { params.rooms[b.dataset.ceil].ceiling = b.dataset.v; save(); render(); });
  on("[data-method]", (b) => { const r = params.rooms[b.dataset.room]; if (b.dataset.method) r.method = b.dataset.method; else delete r.method; save(); render(); });
  on("#upper-reset", () => { params.upper_factor = 5 / 6; save(); render(); });
  on("#prev", () => { step = Math.max(0, step - 1); save(); render(); });
  on("#next", () => { step = Math.min(7, step + 1); save(); render(); });
  const sym = document.getElementById("sym");
  if (sym) sym.onchange = () => { params.asymmetric = !sym.checked; save(); render(); };
  const up = document.getElementById("upper");
  if (up) up.oninput = () => { params.upper_factor = Number(up.value); save(); render(true); };
  const win = document.getElementById("win");
  if (win) win.oninput = () => { params.window_ratio = Number(win.value); save(); render(true); };
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = () => {
    const text = document.getElementById("json").value;
    const msg = document.getElementById("copy-msg");
    navigator.clipboard.writeText(text).then(() => { msg.textContent = t().copied; },
      () => { const ta = document.getElementById("json"); ta.hidden = false; ta.select(); msg.textContent = t().copyFail; });
  };
}

let currentDesign = null;
function render(drawingOnly) {
  currentDesign = run(params);
  renderPlan(currentDesign);
  renderElevation(currentDesign);
  renderRail(currentDesign);
  if (!drawingOnly) renderPanel(currentDesign);
  else {
    // keep the panel's live numbers in step while dragging or sliding
    const keep = document.activeElement && document.activeElement.id;
    renderPanel(currentDesign);
    if (keep && document.getElementById(keep)) document.getElementById(keep).focus();
  }
  document.getElementById("t-sub").textContent = t().sub;
  document.getElementById("t-plan").textContent = t().plan;
  document.getElementById("t-elev").textContent = t().elev;
  document.getElementById("sound").textContent = t().sound;
  document.getElementById("lang").textContent = lang === "de" ? "EN" : "DE";
  document.documentElement.lang = lang;
}

document.getElementById("lang").onclick = () => { lang = lang === "de" ? "en" : "de"; save(); render(); };
document.getElementById("sound").onclick = (e) => {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; }
  const onNow = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(onNow));
  if (!onNow) audio = null; else tone(currentDesign.rooms[0].ratio);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render(true));
render();
</script>
