[project]
name = "palladio-code-pilot"
version = "0.1.0"
description = "Quellenkritischer Pilot fuer einen maschinenlesbaren Palladio-Code"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pandas>=2.0",
  "Pillow>=10.0",
  "pypdf>=5.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.scripts]
palladio-code = "palladio_code.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

